name: Deploy dashboard

# Builds the React app and publishes ONLY the production build (dist/) to GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: '40 */4 * * *' # rebuild the job search index every 4 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine + connector self-tests
        run: npm run test:engine

      - name: Check Firebase web config secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          missing=""
          for k in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MESSAGING_SENDER_ID; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Firebase not configured::Missing secrets:$missing. The site will deploy but show the 'Connect Firebase' setup screen. See FIREBASE_SETUP.md."
          else
            echo "All Firebase web config secrets are present."
          fi

      - name: Type-check and build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

      - name: Build job search index (employer careers boards)
        # A partial failure still publishes; the Search page shows which boards failed.
        continue-on-error: true
        env:
          OUT: dist/data/jobs-index.json
          EXTRA_BOARDS: ${{ vars.EXTRA_BOARDS }}
        run: npm run index

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then echo "::error::dist/index.html still references source files"; exit 1; fi
          ls -la dist dist/assets | head -40
          if [ -f dist/data/jobs-index.json ]; then ls -la dist/data; else echo "::warning title=No search index::dist/data/jobs-index.json was not built; Search will show 'index not built'."; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        run: echo "### Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
